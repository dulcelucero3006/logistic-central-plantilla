name: Supabase keepalive

on:
  schedule:
    # Cada 3 días, para que nunca pasen los 7 días de inactividad que pausan el proyecto gratis de Supabase.
    - cron: '0 12 */3 * *'
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Hacer una consulta mínima a la base de datos
        run: |
          curl -sf -X POST "${{ secrets.KEEPALIVE_SUPABASE_URL }}/rest/v1/rpc/ping" \
            -H "apikey: ${{ secrets.KEEPALIVE_SUPABASE_ANON_KEY }}" \
            -H "Content-Type: application/json" -d '{}'
